buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id+'-forge'+minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            arg "-mixin.config=cataclysm_dimension.mixins.json"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            arg "-mixin.config=cataclysm_dimension.mixins.json"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        url "https://repo.spongepowered.org/repository/maven-public/"
    }

}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:lendercataclysm-551586:7821746")
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    implementation fg.deobf("curse.maven:lionfish-api-1001614:5922047")

//    implementation fg.deobf("curse.maven:integrated-cataclysm-1164949:7046903")
//    implementation fg.deobf("curse.maven:create-328085:6641603")
//    implementation fg.deobf("curse.maven:integrated-api-817709:6369317")
//    implementation fg.deobf("curse.maven:quark-243121:6427817")
//    implementation fg.deobf("curse.maven:supplementaries-412082:7054158")

}

mixin {
    add sourceSets.main, 'cataclysm_dimension.mixin-refmap.json'
    config 'cataclysm_dimension.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "cataclysm_dimension.mixins.json"
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def verifyMixinRefmap = tasks.register('verifyMixinRefmap') {
    dependsOn tasks.named('reobfJar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        def contents = zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile)
        def config = new groovy.json.JsonSlurper().parse(contents.matching {
            include 'cataclysm_dimension.mixins.json'
        }.singleFile)
        if (config.refmap != 'cataclysm_dimension.mixin-refmap.json') {
            throw new GradleException('The production Mixin config must reference its generated refmap')
        }
        def refmap = new groovy.json.JsonSlurper().parse(contents.matching {
            include config.refmap
        }.singleFile)
        def target = refmap.mappings['com/p1nero/cataclysm_dimension/mixin/ChunkAccessMixin']?.markPosForPostprocessing
        if (!(target instanceof String) || !(target =~ /;m_\d+_\(/).find()) {
            throw new GradleException('The packaged refmap must map ChunkAccessMixin to its production SRG method')
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyMixinRefmap
}
